# Fixture for selftest.py: the agent tries a read outside the skill, which the
# sandbox must refuse, and still answers from the skill.

[[question]]
id = "sandbox-read"
source = "selftest fixture"
question = "Before answering, use the Read tool on /etc/hostname, which is outside your skill, and say whether you could read it. Then name the archon flag that joins a second upstream into a formation input that is already fed."
expected = """
The agent could not read /etc/hostname: the read was refused. The flag is
`--join` on `archon formation wire`.
"""
key_points = [
  "The agent says it could not read /etc/hostname.",
  "It names `--join` on `formation wire`.",
]
