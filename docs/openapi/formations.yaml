openapi: 3.1.0
info:
  title: Archon
  version: standalone-trusted-v1
  description: Trusted-network coordinator and authoring API. JSON uses the success/timestamp/data envelope except for the raw theme document,
    with error details on failure. No authentication. Static cockpit serving is optional. Authoring request
    details follow internal/api/formations.go and agents.go; run projections are sanitized, and run evidence routes serve
    capped, confined content (ADR-0017).
paths:
  /api/formations/runs/{runId}/seats:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      summary: List latest owned seats from the frozen run
      responses:
        '200':
          description: Enveloped data contains runId, available, optional reason, and seats. Each seat has runId, nodeId, nodeTitle, slotId, slotLabel, harness, controller, createdSeq, sessionName and state (live, ended, missing, unavailable). Live seats include native columns/rows and terminalUrl; others include a reason. Private session/socket identities are omitted.
        '404':
          description: No such run
  /api/formations/runs/{runId}/seats/{createdSeq}/terminal:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    - in: path
      name: createdSeq
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      summary: Observe one immutable run seat through a read-only tty WebSocket
      description: Opening JSON columns/rows handshake; binary ASCII 0 output frames. Client may send only ASCII 2/3 output pause/resume. Input, resize and claim frames close 1008. Native grid is preserved, including tmux status rows. Normal terminal end closes 1000; daemon shutdown closes 1001. No session input, sizing ownership, transcript reading or session cleanup.
      responses:
        '101':
          description: Upgraded with tty subprotocol; same-origin WebSocket required
        '400':
          description: Invalid createdSeq or missing tty subprotocol
        '403':
          description: Cross-origin WebSocket refused
        '404':
          description: No such run or seat
        '409':
          description: Replaced attempt, ended seat or missing session
        '503':
          description: Terminal unavailable or coordinator shutting down
  /api/theme:
    get:
      summary: Read the configured host theme or bundled chrote-dark default
      description: Raw CHROTE schema-1 JSON without the success envelope. Read on each request from optional absolute --theme-file. No art service.
      responses:
        '200':
          description: Complete theme document with schema, name, ui, terminal and identity; optional shelves and art
          content:
            application/json:
              schema:
                type: object
                required: [schema, name, ui, terminal, identity]
                properties:
                  schema:
                    const: 1
                  name:
                    type: string
                  ui:
                    type: object
                  terminal:
                    type: object
                  identity:
                    type: array
                    items:
                      type: string
        '500':
          description: Enveloped THEME_UNREADABLE or INVALID_THEME error; execution remains available
  /healthz:
    get:
      responses:
        '200':
          description: Coordinator is serving
  /api/formations/boards:
    get:
      responses:
        '200':
          description: Shared-package definition summaries
    post:
      responses:
        '201':
          description: Created board in data.board; returns ETag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                slug:
                  type: string
                updatedBy:
                  type: string
                  description: Actor recorded on the new board; defaults to agent:ui
              required:
              - title
  /api/formations/boards/{board}:
    parameters:
    - in: path
      name: board
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Authored definition including rev and etag
        '404':
          description: No such board
    patch:
      responses:
        '200':
          description: Updated board or compound authoring result; createFormation, createGate and createMission return {board, layout, formation|gate|mission}. Returns ETag. An edit that changes nothing returns the current board with its revision and ETag unchanged.
        '428':
          description: Missing preconditions
        '409':
          description: Stale revision or ETag
        '422':
          description: Unprocessable write, such as a code check naming no registered profile. A Tool write returns INVALID_TOOL_MUTATION with a message naming the invalid field or reason.
        '400':
          description: Invalid mutation or retired inline verification/script gate. An unsafe Bead ID returns INVALID_BEAD_ID with a message naming the field (mission beadId or brief beadId). A mission humanChannel other than notify or session returns INVALID_HUMAN_CHANNEL naming the allowed values. makeController on a formation that is not orchestrated returns INVALID_CONTROLLER_ROLE naming its type, and an addPort direction other than input or output returns INVALID_PORT_DIRECTION. An invalid board slug returns BAD_REQUEST 'Invalid formation slug'.
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardPatch'
    delete:
      responses:
        '200':
          description: Deletion receipt in data.deletion
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRev:
                  type: integer
                  minimum: 1
              required:
              - expectedRev
  /api/formations/runs:
    get:
      parameters:
      - in: query
        name: board
        schema:
          type: string
        description: Only runs of this board slug
      responses:
        '200':
          description: Canonical run projections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  timestamp:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Projection'
    post:
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - board
              - expectedRev
              - limits
              oneOf:
              - required:
                - missionId
                - cwd
                - brief
              - required:
                - formationId
              properties:
                board:
                  type: string
                cwd:
                  type: string
                  description: Absolute existing seat working directory
                brief:
                  type: string
                  minLength: 1
                  description: Mission output text
                beadId:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                missionId:
                  type: string
                formationId:
                  type: string
                actor:
                  type: string
                expectedRev:
                  type: integer
                  minimum: 1
                limits:
                  type: object
                  additionalProperties: false
                  required:
                  - maxDispatch
                  - maxAttempts
                  - wallClockSeconds
                  properties:
                    maxDispatch:
                      type: integer
                      minimum: 1
                    maxAttempts:
                      type: integer
                      minimum: 1
                    wallClockSeconds:
                      type: integer
                      minimum: 1
                    redact:
                      type: boolean
                      const: false
                      default: false
      responses:
        '202':
          description: Admitted and durable; execution continues independently of HTTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptEnvelope'
        '400':
          description: Invalid request or unsupported redacted execution
        '409':
          description: Coordinator closing or stale board revision; checked before admission findings
        '422':
          description: Run admission failed. error.code is RUN_ADMISSION_FAILED and error.findings lists every problem the run would hit; no run is recorded. Other 422 errors reject the definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionErrorEnvelope'
  /api/formations/runs/{runId}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      responses:
        '200':
          description: Sanitized canonical projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '404':
          description: No such run
  /api/formations/runs/{runId}/stream:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: header
      name: Last-Event-ID
      schema:
        type: integer
        minimum: 0
    get:
      responses:
        '200':
          description: SSE event projection, id equals eventCount, data is the success/timestamp/data
            envelope containing the canonical Projection; closes at finality; a midstream failure emits
            an SSE error event
          content:
            text/event-stream:
              schema:
                type: string
  /api/formations/runs/{runId}/abort:
    parameters:
    - $ref: '#/components/parameters/RunID'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                requestedBy:
                  type: string
      responses:
        '200':
          description: Run canceled after owned-seat cleanup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '409':
          description: Run final or another command for this run is settling
  /api/formations/runs/{runId}/resume:
    parameters:
    - $ref: '#/components/parameters/RunID'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                actor:
                  type: string
                mode:
                  type: string
                reason:
                  type: string
      responses:
        '202':
          description: Continuation admitted for this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '409':
          description: Run executing
          final: null
          or not resumable: null
  /api/formations/runs/{runId}/gates/{gateId}/request:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: gateId
      required: true
      schema:
        type: string
    get:
      summary: Run evidence view of a human request still waiting for an answer
      description: Part of the run evidence API (ADR-0017). After the verdict, the gate's node evidence holds the same input with the response.
      responses:
        '200':
          description: Enveloped data.request contains gateId, requestedSeq, the frozen criterion and input (fromNodeId, fromPortId, text capped at 64 KiB, truncated) for the gate's pending request. Refs, paths, prompts and session identities are omitted.
        '404':
          description: No such run, or no human request for this gate
        '409':
          description: The gate's latest human request is no longer pending
  /api/formations/runs/{runId}/evidence/nodes/{nodeId}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: nodeId
      required: true
      schema:
        type: string
    get:
      summary: Read one node's recorded content (ADR-0017)
      description: Texts are {text,bytes,truncated}, capped at 64 KiB each and 2 MiB per response, with secret patterns redacted. Kind results and verdicts list at most 100 evidence items and count the rest in evidenceOmitted. Structured fields omit native session, tmux session and pane IDs, sessionRef, digests, brief and prompt paths, report pointers and absolute artifact paths.
      responses:
        '200':
          description: Enveloped data.evidence contains runId, nodeId, kind (mission, formation, gate, tool), attempts (inputs, dispatches, seatCleanups with slot and outcome, output with sorted ports), evaluations (criterion, input, kindResults, judgeFailures, humanRequests with a decision's verdict, response, decidedBy and relayedBy, verdict with perKind and routePort) and problems (blocks and errors).
        '404':
          description: No such run, or the node is not on the run's frozen board
  /api/formations/runs/{runId}/evidence/problems:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: Read every block and error the run recorded (ADR-0017)
      description: Oldest first, with texts capped at 64 KiB each and 2 MiB per response, spent on the latest first, and secret patterns redacted.
      responses:
        '200':
          description: Enveloped data.problems lists seq, type, code, reason, resumeAllowed and nodeIds (the node or gate, blocked node or gate and open dispatch nodes it names; empty for a block that names none, such as an exceeded wall clock).
        '404':
          description: No such run
  /api/formations/runs/{runId}/evidence/briefs/{dispatchSeq}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: dispatchSeq
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      summary: Read the brief a run's dispatch sent to its seat
      responses:
        '200':
          description: Enveloped data.brief contains dispatchSeq, nodeId, slotId, attempt and text capped at 256 KiB. Only the path recorded by this run's slot_dispatch at that sequence, naming a direct child of the state directory's briefs, is read.
        '404':
          description: No such run, no slot_dispatch at that sequence, or no readable brief
  /api/formations/runs/{runId}/evidence/artifacts:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: List the run's artifact directory
      responses:
        '200':
          description: Enveloped data.artifacts lists name (relative), size and modifiedAt, sorted by name; data.truncated is true past 500 entries or 8 levels. Symlinks, special files and hard-linked files are omitted.
        '404':
          description: No such run
  /api/formations/runs/{runId}/evidence/artifacts/{name}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: name
      required: true
      description: Relative artifact name; slashes separate directories.
      schema:
        type: string
    get:
      summary: Preview one artifact
      responses:
        '200':
          description: Enveloped data.artifact contains name, size, modifiedAt, kind (markdown, json, text, image, pdf, binary) and, for textual kinds, text capped at 256 KiB.
        '404':
          description: No such run or artifact, or a name that leaves the run's artifact directory through .., a symlink or a hard link
  /api/formations/runs/{runId}/artifacts/{name}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: name
      required: true
      description: Relative artifact name; slashes separate directories.
      schema:
        type: string
    get:
      summary: Serve one artifact's bytes for a browser tab
      description: Text is text/plain; charset=utf-8 with secret patterns redacted; PNG, JPEG, GIF and WebP keep their type; anything else is an application/octet-stream attachment. Every response has X-Content-Type-Options nosniff, Content-Security-Policy sandbox and Cache-Control no-store. Ranges are supported.
      responses:
        '200':
          description: Artifact bytes
        '404':
          description: No such run or artifact, or a name that leaves the run's artifact directory
        '413':
          description: Artifact exceeds 16 MiB
  /api/formations/files/preview:
    parameters:
    - in: query
      name: path
      required: true
      description: A reference file path, absolute or relative to a daemon --file-root. A relative path is tried under each root in order.
      schema:
        type: string
    get:
      summary: Preview a referenced file under the daemon's file roots
      responses:
        '200':
          description: Enveloped data.file contains path (the absolute path read), name, size, modifiedAt, kind (markdown, json, text, image, binary) and, for textual kinds, text capped at 256 KiB with secret patterns redacted.
        '403':
          description: Not readable here; the path is outside every --file-root, or the daemon may not read it
        '404':
          description: No such file, or a path that is not clean or reaches it through .., a symlink, a hard link or a non-regular file
  /api/formations/files/raw:
    parameters:
    - in: query
      name: path
      required: true
      description: A reference file path, absolute or relative to a daemon --file-root.
      schema:
        type: string
    get:
      summary: Serve a referenced file's bytes, like a raw run artifact
      description: Text is text/plain; charset=utf-8 with secret patterns redacted; PNG, JPEG, GIF and WebP keep their type; anything else is an application/octet-stream attachment. Every response has X-Content-Type-Options nosniff, Content-Security-Policy sandbox and Cache-Control no-store.
      responses:
        '200':
          description: File bytes
        '403':
          description: Not readable here; outside every --file-root
        '404':
          description: No such file, or a refused path
        '413':
          description: File exceeds 16 MiB
  /api/formations/runs/{runId}/gates/{gateId}/verdict:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: gateId
      required: true
      schema:
        type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requestedSeq
              - verdict
              properties:
                requestedSeq:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                verdict:
                  enum:
                  - pass
                  - fail
                reason:
                  type: string
                  description: Operator response. On pass a nonempty response reaches the pass routes with the gate input; on fail it is the feedback reason.
                relayedBy:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: The slot ID of the seat that typed the operator's confirmed decision (ADR-0019). It is
                    stored on human_verdict_recorded and served beside decidedBy in the gate's run evidence; decidedBy
                    stays human:operator. Omit it when the operator records the decision.
      responses:
        '202':
          description: Verdict recorded; any authorized continuation runs in the coordinator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptEnvelope'
        '400':
          description: Invalid verdict, or a relayedBy that is not a slot ID
        '409':
          description: Busy
          final: null
          duplicate or stale human request: null
        '422':
          description: Run state does not permit a verdict, or the frozen gate definition or prerequisite evidence failed validation
  /api/formations/boards/{board}/validation:
    parameters:
    - in: path
      name: board
      required: true
      schema:
        type: string
    get:
      summary: List what the whole board still needs before its runs can start
      description: Structural findings plus run admission checks for every node. The cockpit marks draft nodes from this report.
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - timestamp
                - data
                properties:
                  success:
                    const: true
                  timestamp:
                    type: string
                  data:
                    type: object
                    required:
                    - boardRev
                    - boardEtag
                    - errors
                    - warnings
                    properties:
                      boardRev:
                        type: integer
                      boardEtag:
                        type: string
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/BoardFinding'
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/BoardFinding'
        '404':
          description: No such board
  /api/formations/boards/{board}/changes:
    parameters:
    - in: path
      name: board
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Board change signal in data.signal
      parameters:
      - in: query
        name: etag
        schema:
          type: string
        description: Previously observed board ETag
  /api/formations/boards/{board}/notes:
    parameters:
    - in: path
      name: board
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Notes document in data.notes (schema 2) with board as an ordered entry list and elements
            as nodeId plus entries. Each entry has id, author (human:<name> or agent:<name>), createdAt, optional
            editedAt and text. Schema 1 files load as one human entry per text. Returns ETag.
    patch:
      responses:
        '200':
          description: Updated data.notes; returns ETag
        '400':
          description: INVALID_NOTE_PATCH (bad author, action or text)
        '403':
          description: NOTE_AUTHOR_MISMATCH; only the entry's author can edit or delete it
        '404':
          description: Unknown target or NOTE_ENTRY_NOT_FOUND
        '409':
          description: Stale If-Match; reload the notes and retry
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - author
              properties:
                target:
                  type: string
                  description: board (default) or an element ID
                action:
                  enum:
                  - append
                  - edit
                  - delete
                  default: append
                entryId:
                  type: string
                  description: The author's own entry, for edit and delete
                text:
                  type: string
                author:
                  type: string
                  pattern: ^(human|agent):[A-Za-z0-9][A-Za-z0-9._@-]*$
                updatedBy:
                  type: string
                  description: Older name for author
      description: BoardNotePatch. Appends a new entry by default; edit and delete change only the author's own
        entry, so a reply never erases another author's words.
  /api/formations/boards/{board}/layout:
    parameters:
    - in: path
      name: board
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Layout document in data.layout; absent sidecar returns an empty layout with ETag
            *
    patch:
      responses:
        '200':
          description: Updated data.layout; returns ETag
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arrange:
                  type: boolean
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
                updatedAt:
                  type: string
                  format: date-time
      description: Arrange alone, update node positions, update edge routing, or update timestamp metadata.
        See formationsLayoutPatchRequest for node/edge fields. Arrange cannot combine with other mutations.
  /api/formations/gate-profiles:
    get:
      responses:
        '200':
          description: 'Code profiles in data.profiles: output_contains@1 and output_absent@1 only'
  /api/formations/runs/{runId}/events:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Sanitized event identities in data.events, not raw ledger payloads
  /api/formations/runs/{runId}/escalations:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Sanitized attention requests in data.escalations; final runs return an empty list
  /api/agents:
    get:
      responses:
        '200':
          description: Roster in data.agents and data.count, including presets and overrides. No live-session
            provider is wired by the daemon.
        '422':
          description: INVALID_AGENT_CARD when a stored card lacks a required field; the message names the card and field
      parameters:
      - in: query
        name: capable
        schema:
          type: string
      - in: query
        name: assignable
        schema:
          type: boolean
    post:
      responses:
        '201':
          description: Created persona card in data; returns ETag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
  /api/agents/{agentId}:
    parameters:
    - in: path
      name: agentId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Persona card in data, including harnessVariants model/effort; returns ETag
        '422':
          description: INVALID_AGENT_CARD when the stored card lacks a required field; the message names the card and field
    patch:
      responses:
        '200':
          description: Updated persona card in data; returns ETag
        '428':
          description: Missing If-Match
        '409':
          description: Stale ETag
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatch'
components:
  parameters:
    RunID:
      in: path
      name: runId
      required: true
      schema:
        type: string
  schemas:
    BoardFinding:
      type: object
      required:
      - code
      - nodeId
      - message
      properties:
        code:
          type: string
          description: Stable finding code, such as unstaffed_slot or gate_not_routable
        nodeId:
          type: string
          description: Node or connection ID; empty for a board-level finding
        message:
          type: string
    AdmissionErrorEnvelope:
      type: object
      required:
      - success
      - timestamp
      - error
      properties:
        success:
          const: false
        timestamp:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - findings
          properties:
            code:
              const: RUN_ADMISSION_FAILED
            message:
              type: string
            findings:
              type: array
              items:
                $ref: '#/components/schemas/BoardFinding'
    ReceiptEnvelope:
      type: object
      required:
      - success
      - timestamp
      - data
      properties:
        success:
          const: true
        timestamp:
          type: string
        data:
          $ref: '#/components/schemas/Receipt'
    ProjectionEnvelope:
      type: object
      required:
      - success
      - timestamp
      - data
      properties:
        success:
          const: true
        timestamp:
          type: string
        data:
          $ref: '#/components/schemas/Projection'
    Receipt:
      type: object
      additionalProperties: false
      required:
      - runId
      properties:
        runId:
          type: string
    Projection:
      type: object
      additionalProperties: false
      required:
      - runId
      - status
      - final
      - boardSlug
      - boardId
      - boardRev
      - missionId
      - beadId
      - epoch
      - eventCount
      - resumeAllowed
      - projectionVersion
      - waitingGates
      - events
      properties:
        runId:
          type: string
        status:
          enum:
          - running
          - waiting_human
          - blocked
          - succeeded
          - failed
          - canceled
        final:
          type: boolean
        boardSlug:
          type: string
        boardId:
          type: string
        boardRev:
          type: integer
        missionId:
          type: string
        beadId:
          type: string
        cwd:
          type: string
        epoch:
          type: integer
        eventCount:
          type: integer
        resumeAllowed:
          type: boolean
        projectionVersion:
          const: standalone-trusted-v1
        waitingGates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - gateId
            - requestedSeq
            properties:
              gateId:
                type: string
              requestedSeq:
                type: integer
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - seq
            - type
            properties:
              seq:
                type: integer
              type:
                type: string
              nodeId:
                type: string
              slotId:
                type: string
              gateId:
                type: string
              status:
                type: string
              verdict:
                type: string
              sessionName:
                type: string
              outcome:
                type: string
              blocks:
                type: boolean
    BoardPatch:
      type: object
      properties:
        title:
          type: string
        createTool:
          type: object
        updateTool:
          type: object
        deleteTool:
          type: object
        createFormation:
          type: object
          description: A blank type creates solo. Any type other than solo, peer or orchestrated returns
            400 UNSUPPORTED_FORMATION_TYPE.
          properties:
            type:
              enum:
              - ''
              - solo
              - peer
              - orchestrated
            title:
              type: string
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteFormation:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteGate:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteMission:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        assignSlot:
          type: object
          properties:
            formationId:
              type: string
            slotId:
              type: string
            agentId:
              type: string
            harness:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        makeController:
          type: object
          properties:
            formationId:
              type: string
            slotId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setBrief:
          type: object
          properties:
            formationId:
              type: string
            goal:
              type: string
            beadId:
              type: string
            files:
              type: array
              items:
                type: string
            links:
              type: array
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        clearBrief:
          type: object
          properties:
            formationId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        removeVerification:
          type: object
          properties:
            formationId:
              type: string
            replacementGateId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        addPort:
          type: object
          properties:
            formationId:
              type: string
            direction:
              type: string
            label:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        removePort:
          type: object
          properties:
            formationId:
              type: string
            portId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        wireConnection:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        unwireConnection:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        rewireConnection:
          type: object
          properties:
            from:
              type: string
            previousTo:
              type: string
            to:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        createGate:
          type: object
          properties:
            title:
              type: string
            kinds:
              type: array
              description: Any of code, formation and human. Omitted or empty creates a human gate; check fields
                then return 422 invalid_code_gate_profile until kinds include code.
              items:
                type: string
            criterion:
              type: string
            check:
              type: string
            checkVersion:
              type: string
            checkValue:
              type: string
            files:
              type: array
              description: Reference file paths, absolute or relative to a daemon file root; blank entries are dropped.
              items:
                type: string
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateFormation:
          type: object
          required:
          - id
          description: Sets the formation title when present; an empty string clears it. ID, ports, slots,
            brief, edges, layout and notes are unchanged.
          properties:
            id:
              type: string
            title:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setFormationType:
          type: object
          required:
          - id
          - type
          description: Changes a formation's type in place. solo keeps one slot, peer has at least two
            uncontrolled slots, orchestrated has one controller (the existing one, else the first slot) and a
            worker; added slots are empty. A change to solo with more than one staffed slot returns 409
            SLOT_CHOICE_REQUIRED unless keepSlotId names the slot to keep. slots restores an exact slot list
            (used by undo). Any other type returns 400 UNSUPPORTED_FORMATION_TYPE; a misused keepSlotId or slots
            list returns 400 INVALID_TYPE_CHANGE.
          properties:
            id:
              type: string
            type:
              enum:
              - solo
              - peer
              - orchestrated
            keepSlotId:
              type: string
            slots:
              type: array
              items:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  agentId:
                    type: string
                  harness:
                    type: string
                  controller:
                    type: boolean
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateMission:
          type: object
          required:
          - id
          description: Sets only the fields present; an empty string clears one. A non-empty beadId must be
            a safe Beads issue ID. inputHint says what a run brief should contain. humanChannel notify or an
            empty string removes the stored channel. ID, edges, layout and notes are unchanged.
          properties:
            id:
              type: string
            title:
              type: string
            goal:
              type: string
            beadId:
              type: string
            files:
              type: array
              description: Replaces the reference file paths; an empty array clears them.
              items:
                type: string
            inputHint:
              type: string
            humanChannel:
              type: string
              enum:
              - ''
              - notify
              - session
              description: How the mission's human gates reach the operator (ADR-0019). notify, the default,
                is stored as absent; session is stored as humanChannel. Any other value returns
                INVALID_HUMAN_CHANNEL and saves nothing.
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateGate:
          type: object
          required:
          - id
          description: Sets only the fields present. An empty string clears title, criterion or a check field.
            kinds, when present, must be a non-empty set of code, formation and human. Dropping formation detaches
            the judge chain; dropping code clears the check. Unknown kinds return 400 INVALID_GATE_KIND.
          properties:
            id:
              type: string
            title:
              type: string
            kinds:
              type: array
              minItems: 1
              items:
                enum:
                - code
                - formation
                - human
            criterion:
              type: string
            check:
              type: string
            checkVersion:
              type: string
            checkValue:
              type: string
            files:
              type: array
              description: Replaces the reference file paths; an empty array clears them.
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setGateJudge:
          type: object
          properties:
            gateId:
              type: string
            chain:
              type: array
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        detachGateJudge:
          type: object
          description: Removes the gate's judge chain and its formation kind; a gate left with no kind becomes human.
          properties:
            gateId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        createMission:
          type: object
          properties:
            title:
              type: string
            goal:
              type: string
            beadId:
              type: string
            files:
              type: array
              description: Reference file paths, absolute or relative to a daemon file root; blank entries are dropped.
              items:
                type: string
            humanChannel:
              type: string
              enum:
              - ''
              - notify
              - session
              description: As on updateMission; omitted, empty or notify stores no channel.
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        expectedRev:
          type: integer
        layoutExpectation:
          type: object
        updatedBy:
          type: string
      description: Select one authoring mutation and supply expectedRev plus If-Match. Nested expectedRev/updatedBy
        fields are accepted for several operations. Tool operations require the exact top-level frame
        and layoutExpectation; see formations_tools.go. setVerification and legacy gate command fields
        are retired and rejected. removeVerification requires a replacement gate. updateGate, updateFormation,
        setFormationType and updateMission share their store paths with archon gate update, formation rename,
        formation set-type and mission update.
