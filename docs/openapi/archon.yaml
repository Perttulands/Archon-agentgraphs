openapi: 3.1.0
info:
  title: Archon
  version: standalone-trusted-v1
  description: Trusted-network coordinator and authoring API. JSON uses the success/timestamp/data envelope except for the raw theme document,
    with error details on failure. No authentication. Static cockpit serving is optional. Authoring request
    details follow internal/api.go and agents.go; run projections are sanitized, and run evidence routes serve
    capped, confined content (ADR-0017).
paths:
  /api/runs/{runId}/seats:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      summary: List latest owned seats from the frozen run
      responses:
        '200':
          description: Enveloped data contains runId, available, optional reason, and seats. Each seat has runId, nodeId, nodeTitle, slotId, slotLabel, harness, the model (absent for the harness default) and effort it was started with, controller, createdSeq, sessionName and state (live, ended, missing, unavailable). Live seats include native columns/rows and terminalUrl; others include a reason. A seat kept on call for a session-channel human gate (ADR-0019) includes onCall with keptSeq and waitingOn, the pending gateId/requestedSeq asks it received. Private session/socket identities are omitted.
        '404':
          description: No such run
  /api/runs/{runId}/seats/{createdSeq}/terminal:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    - in: path
      name: createdSeq
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      summary: Attach to one immutable run seat through a tty WebSocket the operator can type into
      description: CHROTE's frames. Opening JSON columns/rows handshake, then the terminal attaches at the seat's native grid, including tmux status rows. Client binary frames are ASCII 0 plus input bytes for the pane; 1 plus JSON columns/rows, which sizes this view only while another client sizes the seat window and is otherwise ignored; and 2/3 to pause and resume output. Other frames are ignored. The seat window keeps its size. Server frames are ASCII 0 plus output bytes. Normal terminal end closes 1000; daemon shutdown closes 1001. No sizing ownership, transcript reading or session cleanup; dispatches tolerate the operator's turns (see CONTRACT).
      responses:
        '101':
          description: Upgraded with tty subprotocol; same-origin WebSocket required
        '400':
          description: Invalid createdSeq or missing tty subprotocol
        '403':
          description: Cross-origin WebSocket refused
        '404':
          description: No such run or seat
        '409':
          description: Replaced attempt, ended seat or missing session
        '503':
          description: Terminal unavailable or coordinator shutting down
  /api/theme:
    get:
      summary: Read the configured host theme or bundled chrote-dark default
      description: Raw CHROTE schema-1 JSON without the success envelope. Read on each request from optional absolute --theme-file. No art service.
      responses:
        '200':
          description: Complete theme document with schema, name, ui, terminal and identity; optional shelves and art
          content:
            application/json:
              schema:
                type: object
                required: [schema, name, ui, terminal, identity]
                properties:
                  schema:
                    const: 1
                  name:
                    type: string
                  ui:
                    type: object
                  terminal:
                    type: object
                  identity:
                    type: array
                    items:
                      type: string
        '500':
          description: Enveloped THEME_UNREADABLE or INVALID_THEME error; execution remains available
  /healthz:
    get:
      responses:
        '200':
          description: Coordinator is serving. Enveloped data carries status ok, and the running build's version and commit.
  /api/missions:
    get:
      responses:
        '200':
          description: Mission summaries in data.missions. A mission file that cannot be read, such as a symlink whose target moved, is listed with only its slug and broken, the reason; the others list as usual.
    post:
      responses:
        '201':
          description: Created mission in data.mission; returns ETag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                slug:
                  type: string
                updatedBy:
                  type: string
                  description: Actor recorded on the new mission; defaults to human:ui, the cockpit
              required:
              - title
  /api/missions/{mission}:
    parameters:
    - in: path
      name: mission
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Authored definition including rev and etag
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mission:
                        type: object
                        properties:
                          formations:
                            type: array
                            items:
                              $ref: '#/components/schemas/FormationNode'
        '404':
          description: No such mission
    patch:
      responses:
        '200':
          description: Updated mission or compound authoring result; createFormation, createGate, createEnd and createInputCard return {mission, layout, formation|gate|end|inputCard}; deleteEnd returns {mission, layout, endId}. Returns ETag. An edit that changes nothing returns the current mission with its revision and ETag unchanged.
        '428':
          description: Missing preconditions
        '409':
          description: Stale revision or ETag
        '422':
          description: Unprocessable write, such as a code check naming no registered profile. A Tool write returns INVALID_TOOL_MUTATION with a message naming the invalid field or reason. An assignSlot whose harness, model or effort no seat could start with, or that leaves the harness or effort unchosen, returns INVALID_SLOT_SETTINGS with a message naming the slot and the fix, including the effort policy when the effort is missing.
        '400':
          description: Invalid mutation. An unsafe Bead ID returns INVALID_BEAD_ID with a message naming the field (brief beadId). An Input card humanChannel other than notify or session returns INVALID_HUMAN_CHANNEL naming the allowed values. A malformed or repeated input name or an unknown input kind returns INVALID_MISSION_INPUT. makeController on a formation that is not orchestrated returns INVALID_CONTROLLER_ROLE naming its type, and an addPort direction other than input or output returns INVALID_PORT_DIRECTION. A relative reference file returns RELATIVE_FILE_REFERENCE. A patch naming more than one operation returns BAD_REQUEST naming them, and nothing changes. An invalid mission slug returns BAD_REQUEST 'Invalid mission slug'.
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionPatch'
    delete:
      responses:
        '200':
          description: Deletion receipt in data.deletion
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedRev:
                  type: integer
                  minimum: 1
              required:
              - expectedRev
  /api/runs:
    get:
      parameters:
      - in: query
        name: mission
        schema:
          type: string
        description: Only the runs of the mission now under this slug or ID; none for a mission that does not exist, and none of a deleted mission that had the same slug.
      - in: query
        name: needs
        schema:
          const: you
        description: Only open runs that need the operator, waiting at a human gate or blocked.
      responses:
        '200':
          description: Canonical run projections
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  timestamp:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Projection'
    post:
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - mission
              - expectedRev
              oneOf:
              - required:
                - inputCardId
              - required:
                - formationId
              description: A mission run starts from its Input card; a single step's run names the formation.
                Both take the same run fields and the mission's inputs (archon-o7p.3).
              properties:
                mission:
                  type: string
                  description: The mission's slug or ID.
                inputCardId:
                  type: string
                  description: The Input card to start from.
                inputs:
                  type: object
                  additionalProperties:
                    type: string
                  description: The values the run supplies, by input name. A mission that declares no inputs
                    takes one required text input, brief, whose value is the Input card's output text unchanged.
                    Admission reports a required input missing or blank (missing_input), a name the mission
                    does not declare (unknown_input) and a file or folder value that is not the absolute path
                    of an existing file or directory (invalid_input) as RUN_ADMISSION_FAILED findings on the
                    Input card. Omitted means none.
                cwd:
                  type: string
                  description: Absolute existing seat working directory; omitted or empty creates a private workspace under the configured run workspace root
                contextPaths:
                  type: array
                  items:
                    type: string
                  description: Absolute existing file or directory references, independent of cwd; recorded on the run and supplied to every seat for inspection. Contents are not snapshotted.
                beadId:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                formationId:
                  type: string
                actor:
                  type: string
                  description: Who drives the run, shown as its startedBy; omitted means operator:standalone.
                expectedRev:
                  type: integer
                  minimum: 1
                limits:
                  type: object
                  additionalProperties: false
                  description: Optional. A run has no limits unless the launch sets them; an absent or zero
                    limit means none, and a negative limit is rejected.
                  properties:
                    maxDispatch:
                      type: integer
                      minimum: 0
                      description: Cap on the run's formation starts, judges included. Absent or 0 means no limit.
                    maxAttempts:
                      type: integer
                      minimum: 0
                      description: Cap on each step's attempts. Absent or 0 means no limit.
                    wallClockSeconds:
                      type: integer
                      minimum: 0
                      description: Time the run's agent work may take from its start. Waits at human gates, from
                        each request to its verdict, do not count. Absent or 0 means no limit.
                    formationTimeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 9223372036
                      readOnly: true
                      description: Server-owned execution default for formations without an authored duration.
                        Resolved at admission and frozen with the run; clients need not supply it.
                    redact:
                      type: boolean
                      const: false
                      default: false
      responses:
        '202':
          description: Admitted and durable; execution continues independently of HTTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptEnvelope'
        '400':
          description: Invalid request or unsupported redacted execution
        '409':
          description: Coordinator closing or stale mission revision; checked before admission findings
        '422':
          description: Run admission failed. error.code is RUN_ADMISSION_FAILED and error.findings lists every problem the run would hit; no run is recorded. Other 422 errors reject the definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionErrorEnvelope'
  /api/runs/{runId}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      responses:
        '200':
          description: Sanitized canonical projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '404':
          description: No such run
  /api/runs/{runId}/stream:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: header
      name: Last-Event-ID
      schema:
        type: integer
        minimum: 0
    get:
      responses:
        '200':
          description: SSE event projection, id equals eventCount, data is the success/timestamp/data
            envelope containing the canonical Projection; closes at finality; a midstream failure emits
            an SSE error event
          content:
            text/event-stream:
              schema:
                type: string
  /api/runs/{runId}/abort:
    parameters:
    - $ref: '#/components/parameters/RunID'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                requestedBy:
                  type: string
      responses:
        '200':
          description: Run canceled after owned-seat cleanup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '409':
          description: Run final or another command for this run is settling
  /api/runs/{runId}/resume:
    parameters:
    - $ref: '#/components/parameters/RunID'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                actor:
                  type: string
                mode:
                  type: string
                reason:
                  type: string
      responses:
        '202':
          description: Continuation admitted for this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionEnvelope'
        '409':
          description: Run still executing after a five-second wait for its command
          final: null
          or not resumable: null
  /api/runs/{runId}/wait:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: Hold until the run needs its driver, ends or changes after a ledger sequence
      description: The long poll behind archon run wait (archon-o7p.6). A final run answers at once in every mode.
      parameters:
      - in: query
        name: until
        schema:
          type: string
          enum: [needs-you, final, any-change]
          default: needs-you
      - in: query
        name: since
        description: Ledger sequence the driver has already seen; asks and changes after it are new.
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: hold
        description: Seconds to hold before answering pending.
        schema:
          type: integer
          minimum: 0
          maximum: 60
          default: 30
      responses:
        '200':
          description: Enveloped data contains runId, missionSlug, missionTitle, until, outcome (final, needs-you, changed, pending), since, seq (the next since), status, final, resumeAllowed, settled, end (status, seq, code, reason, reasonTruncated, endedBy, stopped), asks (kind, seq, new, gateId, nodeId, title, criterion, reason, code, severity, resumeAllowed, input with fromNodeId, fromTitle, fromPortId, text capped at 4 KiB, bytes and truncated, routes) and changes (seq, type, nodeId, gateId, title, attempt, status, verdict; the latest 50, with changesOmitted). Texts are redacted like run evidence.
        '400':
          description: Bad until, since or hold, or since past the run's last event
        '404':
          description: No such run
        '503':
          description: The daemon is stopping; wait again with the same since
  /api/runs/{runId}/gates/{gateId}/request:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: gateId
      required: true
      schema:
        type: string
    get:
      summary: Run evidence view of a human request still waiting for an answer
      description: Part of the run evidence API (ADR-0017). After the verdict, the gate's node evidence holds the same input with the response.
      responses:
        '200':
          description: Enveloped data.request contains gateId, requestedSeq, the frozen criterion and input (fromNodeId, fromPortId, text capped at 64 KiB, truncated) for the gate's pending request. Refs, paths, prompts and session identities are omitted.
        '404':
          description: No such run, or no human request for this gate
        '409':
          description: The gate's latest human request is no longer pending
  /api/runs/{runId}/evidence/nodes/{nodeId}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: nodeId
      required: true
      schema:
        type: string
    get:
      summary: Read one node's recorded content (ADR-0017)
      description: Texts are {text,bytes,truncated}, capped at 64 KiB each and 2 MiB per response, with secret patterns redacted. Kind results and verdicts list at most 100 evidence items and count the rest in evidenceOmitted. Structured fields omit native session, tmux session and pane IDs, sessionRef, digests, brief and prompt paths, report pointers and absolute artifact paths.
      responses:
        '200':
          description: Enveloped data.evidence contains runId, nodeId, kind (inputCard, formation, gate, tool), attempts (inputs, dispatches, seatCleanups with slot and outcome, output with sorted ports), evaluations (criterion, input, kindResults, judgeFailures, humanRequests with a decision's verdict, response, decidedBy and relayedBy, verdict with perKind and routePort) and problems (blocks and errors).
        '404':
          description: No such run, or the node is not in the run's frozen mission
  /api/runs/{runId}/evidence/problems:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: Read every block and error the run recorded (ADR-0017)
      description: Oldest first, with texts capped at 64 KiB each and 2 MiB per response, spent on the latest first, and secret patterns redacted.
      responses:
        '200':
          description: Enveloped data.problems lists seq, type, code, reason, resumeAllowed and nodeIds (the node or gate, blocked node or gate and open dispatch nodes it names; empty for a block that names none, such as an exceeded wall clock).
        '404':
          description: No such run
  /api/runs/{runId}/evidence/briefs/{dispatchSeq}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: dispatchSeq
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      summary: Read the brief a run's dispatch sent to its seat
      responses:
        '200':
          description: Enveloped data.brief contains dispatchSeq, nodeId, slotId, attempt and text capped at 256 KiB. Only the path recorded by this run's slot_dispatch at that sequence, naming a direct child of the state directory's briefs, is read.
        '404':
          description: No such run, no slot_dispatch at that sequence, or no readable brief
  /api/runs/{runId}/evidence/mission:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: Read the mission as the run froze it at admission
      responses:
        '200':
          description: Enveloped data.mission contains missionRev and text, the frozen mission TOML capped at 256 KiB; later edits never change it.
        '404':
          description: No such run
  /api/runs/{runId}/evidence/artifacts:
    parameters:
    - $ref: '#/components/parameters/RunID'
    get:
      summary: List the run's artifact directory
      responses:
        '200':
          description: Enveloped data.artifacts lists name (relative), size and modifiedAt, sorted by name; data.truncated is true past 500 entries or 8 levels. Symlinks and hard links are followed; special files are omitted.
        '404':
          description: No such run
  /api/runs/{runId}/evidence/artifacts/{name}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: name
      required: true
      description: Relative artifact name; slashes separate directories.
      schema:
        type: string
    get:
      summary: Preview one artifact
      responses:
        '200':
          description: Enveloped data.artifact contains name, size, modifiedAt, kind (markdown, json, text, image, pdf, binary), path (its absolute path on the daemon host) and, for textual kinds, text capped at 256 KiB.
        '404':
          description: No such run or artifact, or a name that leaves the run's artifact directory through .., a symlink or a hard link
  /api/runs/{runId}/artifacts/{name}:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: name
      required: true
      description: Relative artifact name; slashes separate directories.
      schema:
        type: string
    get:
      summary: Serve one artifact's bytes for a browser tab
      description: Text is text/plain; charset=utf-8 with secret patterns redacted; PNG, JPEG, GIF and WebP keep their type; anything else is an application/octet-stream attachment. Every response has X-Content-Type-Options nosniff, Content-Security-Policy sandbox and Cache-Control no-store. Ranges are supported.
      responses:
        '200':
          description: Artifact bytes
        '404':
          description: No such run or artifact, or a name that leaves the run's artifact directory
        '413':
          description: Artifact exceeds 16 MiB
  /api/files/preview:
    parameters:
    - in: query
      name: path
      required: true
      description: A reference file's absolute path, as authored. Symlinks are followed.
      schema:
        type: string
    get:
      summary: Preview a referenced file
      responses:
        '200':
          description: Enveloped data.file contains path (the absolute path read), name, size, modifiedAt, kind (markdown, json, text, image, binary) and, for textual kinds, text capped at 256 KiB with secret patterns redacted.
        '400':
          description: A relative path, which has no base; use an absolute path
        '403':
          description: The daemon's user may not read the file
        '404':
          description: No such file, or a directory or other non-regular file
  /api/files/raw:
    parameters:
    - in: query
      name: path
      required: true
      description: A reference file's absolute path, as authored. Symlinks are followed.
      schema:
        type: string
    get:
      summary: Serve a referenced file's bytes, like a raw run artifact
      description: Text is text/plain; charset=utf-8 with secret patterns redacted; PNG, JPEG, GIF and WebP keep their type; anything else is an application/octet-stream attachment. Every response has X-Content-Type-Options nosniff, Content-Security-Policy sandbox and Cache-Control no-store.
      responses:
        '200':
          description: File bytes
        '400':
          description: A relative path, which has no base; use an absolute path
        '403':
          description: The daemon's user may not read the file
        '404':
          description: No such file, or a directory or other non-regular file
        '413':
          description: File exceeds 16 MiB
  /api/runs/{runId}/gates/{gateId}/verdict:
    parameters:
    - $ref: '#/components/parameters/RunID'
    - in: path
      name: gateId
      required: true
      schema:
        type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - requestedSeq
              - verdict
              properties:
                requestedSeq:
                  type: integer
                  minimum: 1
                actor:
                  type: string
                verdict:
                  enum:
                  - pass
                  - fail
                reason:
                  type: string
                  description: Verbatim operator response, including whitespace and newlines. On pass a nonempty response reaches the pass routes with the gate input; on fail it is the feedback reason.
                relayedBy:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: The slot ID of the seat that typed the operator's confirmed decision (ADR-0019). It is
                    stored on human_verdict_recorded and served beside decidedBy in the gate's run evidence; decidedBy
                    stays human:operator. Omit it when the operator records the decision.
      responses:
        '202':
          description: Verdict recorded; any authorized continuation runs in the coordinator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptEnvelope'
        '400':
          description: Invalid verdict, or a relayedBy that is not a slot ID
        '409':
          description: Busy after a five-second wait for the run's command
          final: null
          duplicate or stale human request: null
        '422':
          description: Run state does not permit a verdict, or the frozen gate definition or prerequisite evidence failed validation
  /api/missions/{mission}/validation:
    parameters:
    - in: path
      name: mission
      required: true
      schema:
        type: string
    get:
      summary: List what the whole mission still needs before its runs can start. A file holding several Input cards gets one several_input_cards error naming them and how to split the file, and admission refuses its runs with the same message.
      description: Structural findings plus run admission checks for every node. The cockpit marks draft nodes from this report.
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - timestamp
                - data
                properties:
                  success:
                    const: true
                  timestamp:
                    type: string
                  data:
                    type: object
                    required:
                    - missionRev
                    - missionEtag
                    - errors
                    - warnings
                    properties:
                      missionRev:
                        type: integer
                      missionEtag:
                        type: string
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/MissionFinding'
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/MissionFinding'
        '404':
          description: No such mission
  /api/missions/{mission}/changes:
    parameters:
    - in: path
      name: mission
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Mission change signal in data.signal
      parameters:
      - in: query
        name: etag
        schema:
          type: string
        description: Previously observed mission ETag
  /api/missions/{mission}/notes:
    parameters:
    - in: path
      name: mission
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Notes document in data.notes (schema 2) with mission (the mission thread) as an ordered entry list and elements
            as nodeId plus entries. Each entry has id, author (human:<name> or agent:<name>), createdAt, optional
            editedAt and text. Returns ETag.
    patch:
      responses:
        '200':
          description: Updated data.notes; returns ETag
        '400':
          description: INVALID_NOTE_PATCH (bad author, action or text)
        '403':
          description: NOTE_AUTHOR_MISMATCH; only the entry's author can edit or delete it
        '404':
          description: Unknown target or NOTE_ENTRY_NOT_FOUND
        '409':
          description: Stale If-Match; reload the notes and retry
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - author
              properties:
                target:
                  type: string
                  description: mission (the mission thread, default) or an element ID
                action:
                  enum:
                  - append
                  - edit
                  - delete
                  default: append
                entryId:
                  type: string
                  description: The author's own entry, for edit and delete
                text:
                  type: string
                author:
                  type: string
                  pattern: ^(human|agent):[A-Za-z0-9][A-Za-z0-9._@-]*$
      description: NotePatch. Appends a new entry by default; edit and delete change only the author's own
        entry, so a reply never erases another author's words.
  /api/missions/{mission}/layout:
    parameters:
    - in: path
      name: mission
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Layout document in data.layout; absent sidecar returns an empty layout with ETag
            *
    patch:
      responses:
        '200':
          description: Updated data.layout; returns ETag
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arrange:
                  type: boolean
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
                updatedAt:
                  type: string
                  format: date-time
      description: Arrange alone, update node positions, update edge routing, or update timestamp metadata.
        See formationsLayoutPatchRequest for node/edge fields. Arrange cannot combine with other mutations.
  /api/gate-profiles:
    get:
      responses:
        '200':
          description: 'Code profiles in data.profiles: output_contains@1 and output_absent@1 only'
  /api/runs/{runId}/events:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Sanitized event identities in data.events, not raw ledger payloads
  /api/runs/{runId}/escalations:
    parameters:
    - in: path
      name: runId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Sanitized attention requests in data.escalations; final runs return an empty list
  /api/agents:
    get:
      responses:
        '200':
          description: Roster in data.agents and data.count, including presets and overrides, and
            data.harnesses, the harnesses whose seats Archon starts, each with the efforts it accepts, its
            defaultEffort and its known models ({id, efforts?}; claude-code's aliases, and the Codex models the
            daemon host's models_cache.json lists, each with the efforts that model accepts), and data.effortPolicy, the {effort,use,kinds?} lines that guide a slot's effort by the role kinds each suits (low for
            errands: verifier, scout; medium for making things: builder, debugger, operator; xhigh for
            architecture and review: reviewer, judge, architect, designer, planner, orchestrator; max for
            consequential reviews, with no kinds: chosen by hand, never suggested). A role is live when the
            session named after it runs. A card that cannot be read is left out and named in data.unreadable
            ({name, reason}). No live-session provider is wired by the daemon.
        '422':
          description: INVALID_AGENT_CARD when a stored card lacks a required field; the message names the card and field
      parameters:
      - in: query
        name: capable
        schema:
          type: string
      - in: query
        name: assignable
        schema:
          type: boolean
    post:
      responses:
        '201':
          description: Created persona card in data; returns ETag
        '422':
          description: INVALID_AGENT_CARD when the card would lack a required field, or the request names a field
            the endpoint does not take, such as harness, model or effort (a role carries none); the message names it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
  /api/agents/{agentId}:
    parameters:
    - in: path
      name: agentId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Persona card in data; returns ETag. A role is role text with no harness, model or
            effort (each slot states its own). Create and patch return the same.
        '422':
          description: INVALID_AGENT_CARD when the stored card lacks a required field; the message names the card and field
    patch:
      responses:
        '200':
          description: Updated persona card in data; returns ETag
        '422':
          description: INVALID_AGENT_CARD when the edited card would lack a required field, or the request names a
            field the endpoint does not take, such as model or effort; the message names it
        '428':
          description: Missing If-Match
        '409':
          description: Stale ETag
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the resource being edited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatch'
    delete:
      responses:
        '200':
          description: The card is removed; data.deleted names the role and data.builtinRemains is true when the
            card overrode a built-in role, which comes back
        '404':
          description: No such role
        '409':
          description: ROLE_IN_USE while any slot, in any mission, names the role (the message names each slot);
            BUILTIN_ROLE for a built-in role, which has no card to delete; CONFLICT for a stale ETag
        '428':
          description: Missing If-Match
      parameters:
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Current ETag of the role's card
  /api/agents/{agentId}/usage:
    parameters:
    - in: path
      name: agentId
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: data.usage lists every slot, in every mission, that names the role, each as {missionId,
            missionSlug, missionTitle, formationId, formationTitle, slotId, slotLabel}
        '404':
          description: No such role
components:
  parameters:
    RunID:
      in: path
      name: runId
      required: true
      schema:
        type: string
  schemas:
    FormationExecutionPolicy:
      type: object
      required: [timeoutSeconds]
      properties:
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 9223372036
          description: Total duration in seconds for one formation invocation, including preparation,
            discussion and finalization. An absent execution policy inherits the execution default
            resolved and frozen at run admission. Human-gate waiting is outside this duration;
            the remaining run deadline can shorten the invocation.
    EndNode:
      type: object
      description: Ends a path on purpose. A run whose path ends at a rejected End node fails with
        run_failed code path_rejected and the routing gate verdict's reason, once nothing else can run.
      required: [id, title, outcome]
      properties:
        id:
          type: string
        title:
          type: string
        outcome:
          type: string
          enum: [done, rejected]
    FormationNode:
      type: object
      description: An authored formation. Execution policy is optional; all other formation fields
        retain their existing authoring semantics.
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        execution:
          $ref: '#/components/schemas/FormationExecutionPolicy'
    MissionFinding:
      type: object
      required:
      - code
      - nodeId
      - message
      properties:
        code:
          type: string
          description: Stable finding code, such as unstaffed_slot or gate_not_routable
        nodeId:
          type: string
          description: Node or connection ID; empty for a mission-level finding
        message:
          type: string
        path:
          type: string
          description: The reference file a missing_file or relative_file warning names
    AdmissionErrorEnvelope:
      type: object
      required:
      - success
      - timestamp
      - error
      properties:
        success:
          const: false
        timestamp:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - findings
          properties:
            code:
              const: RUN_ADMISSION_FAILED
            message:
              type: string
            findings:
              type: array
              items:
                $ref: '#/components/schemas/MissionFinding'
    ReceiptEnvelope:
      type: object
      required:
      - success
      - timestamp
      - data
      properties:
        success:
          const: true
        timestamp:
          type: string
        data:
          $ref: '#/components/schemas/Receipt'
    ProjectionEnvelope:
      type: object
      required:
      - success
      - timestamp
      - data
      properties:
        success:
          const: true
        timestamp:
          type: string
        data:
          $ref: '#/components/schemas/Projection'
    Receipt:
      type: object
      additionalProperties: false
      required:
      - runId
      properties:
        runId:
          type: string
    Projection:
      type: object
      additionalProperties: false
      required:
      - runId
      - status
      - final
      - missionSlug
      - missionId
      - missionRev
      - inputCardId
      - beadId
      - epoch
      - eventCount
      - resumeAllowed
      - projectionVersion
      - humanChannel
      - waitingGates
      - onCallSeats
      - events
      properties:
        runId:
          type: string
        status:
          enum:
          - running
          - waiting_human
          - blocked
          - succeeded
          - failed
          - canceled
        final:
          type: boolean
        missionSlug:
          type: string
        missionId:
          type: string
        missionRev:
          type: integer
        inputCardId:
          type: string
        beadId:
          type: string
        cwd:
          type: string
        contextPaths:
          type: array
          items:
            type: string
        inputs:
          type: array
          description: The values the run supplied, in the mission's declared order.
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              kind:
                enum:
                - text
                - file
                - folder
              value:
                type: string
        epoch:
          type: integer
        eventCount:
          type: integer
        resumeAllowed:
          type: boolean
        startedBy:
          type: string
          description: The run's driver, the actor its start named; operator:standalone when it named none.
        startedAt:
          type: string
          format: date-time
          description: When the run started (its first ledger event).
        updatedAt:
          type: string
          format: date-time
          description: When the run's ledger last changed; a final run ended then.
        projectionVersion:
          const: standalone-trusted-v1
        humanChannel:
          enum:
          - notify
          - session
          description: The run's frozen mission channel for human gates (ADR-0019).
        waitingGates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - gateId
            - requestedSeq
            - askedSeats
            properties:
              gateId:
                type: string
              requestedSeq:
                type: integer
              requestedAt:
                type: string
                format: date-time
                description: When the gate asked.
              askedSeats:
                type: array
                description: Kept seats a session-channel ask was pasted into, in delivery order.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - nodeId
                  - slotId
                  - createdSeq
                  - deliveredSeq
                  properties:
                    nodeId:
                      type: string
                    slotId:
                      type: string
                    createdSeq:
                      type: integer
                    deliveredSeq:
                      type: integer
              fallbackReason:
                type: string
                description: Why a session-channel ask fell back to the notify command.
        onCallSeats:
          type: array
          description: Seats kept on call and not yet ended.
          items:
            type: object
            additionalProperties: false
            required:
            - nodeId
            - slotId
            - createdSeq
            - keptSeq
            - waitingOn
            properties:
              nodeId:
                type: string
              slotId:
                type: string
              createdSeq:
                type: integer
              keptSeq:
                type: integer
              waitingOn:
                type: array
                description: Pending asks this seat received.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - gateId
                  - requestedSeq
                  properties:
                    gateId:
                      type: string
                    requestedSeq:
                      type: integer
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - seq
            - type
            properties:
              seq:
                type: integer
              type:
                type: string
              nodeId:
                type: string
              slotId:
                type: string
              gateId:
                type: string
              attempt:
                type: integer
              requestedSeq:
                type: integer
                description: The human request a human_ask_delivered or human_ask_fallback event concerns.
              status:
                type: string
              verdict:
                type: string
              sessionName:
                type: string
              outcome:
                type: string
                description: A seat_cleanup outcome, or a human_ask_fallback code (lab_executor, no_asking_formation,
                  no_receivable_seat, asked_seats_gone, delivery_uncertain).
              blocks:
                type: boolean
    MissionPatch:
      type: object
      properties:
        title:
          type: string
        createTool:
          type: object
        updateTool:
          type: object
        deleteTool:
          type: object
        createFormation:
          type: object
          description: A blank type creates solo. Any type other than solo, peer or orchestrated returns
            400 UNSUPPORTED_FORMATION_TYPE.
          properties:
            type:
              enum:
              - ''
              - solo
              - peer
              - orchestrated
            title:
              type: string
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteFormation:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteGate:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteInputCard:
          type: object
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        restoreNode:
          type: object
          description: Undo a node delete. Name exactly one of inputCard, formation, gate or end, as the mission
            document showed it before the delete, with the connections that touched it and its layout
            position. The node, its connections and its layout placement publish together or not at
            all, keeping every ID, so its notes and wire lanes apply again. A node ID already in the
            mission, a connection that no longer fits or a malformed field returns INVALID_NODE_RESTORE
            (409) or the field's own error, and nothing changes. A connection ID already in use gets a
            fresh ID. The response carries mission, layout and nodeId.
          properties:
            inputCard:
              type: object
            formation:
              $ref: '#/components/schemas/FormationNode'
            gate:
              type: object
            end:
              $ref: '#/components/schemas/EndNode'
            connections:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
            index:
              type: integer
              minimum: 0
              description: The node's old place among the mission's nodes of its kind; absent appends it.
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        assignSlot:
          type: object
          description: Staffs a slot. The request states the slot's harness, model and effort in full, and agentId
            is its optional role, which adds only role text. Without a harness or an effort, including a request
            naming only agentId, it is refused with INVALID_SLOT_SETTINGS (HTTP 422). A request naming none of
            them empties the slot.
          properties:
            formationId:
              type: string
            slotId:
              type: string
            agentId:
              type: string
              description: The slot's optional role (persona id); blank for a vanilla agent.
            harness:
              type: string
              description: Blank only when clearing the slot.
              enum:
              - ""
              - claude-code
              - openai-codex
            model:
              type: string
              description: One model name without spaces; blank means the harness default model. A model outside
                the harness's known models is accepted, and the answer carries data.warnings naming it. A known
                Codex model narrows the efforts to its own.
            effort:
              type: string
              description: One effort the harness accepts (claude-code low, medium, high, xhigh, max; openai-codex
                also ultra). Choose it by the roster's effortPolicy.
            expectedRev:
              type: integer
            updatedBy:
              type: string
        makeController:
          type: object
          properties:
            formationId:
              type: string
            slotId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setBrief:
          type: object
          properties:
            formationId:
              type: string
            goal:
              type: string
            beadId:
              type: string
            files:
              type: array
              description: Absolute reference file paths; a relative path is refused with RELATIVE_FILE_REFERENCE.
              items:
                type: string
            links:
              type: array
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setExecution:
          type: object
          required: [formationId, timeoutSeconds]
          description: Set a formation's total execution duration. Zero removes its override and
            restores inheritance from the run default. Applies only to new runs.
          properties:
            formationId:
              type: string
            timeoutSeconds:
              type: integer
              minimum: 0
              maximum: 9223372036
            expectedRev:
              type: integer
            updatedBy:
              type: string
        clearBrief:
          type: object
          properties:
            formationId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        addPort:
          type: object
          properties:
            formationId:
              type: string
            direction:
              type: string
              enum:
                - input
                - output
            label:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        removePort:
          type: object
          properties:
            formationId:
              type: string
            portId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        restorePort:
          type: object
          description: Undo removePort. Puts the port back with its id and label at index among the
            formation's ports of that direction, with the connections that used it, in one revision.
            A port id the formation already has, or a connection that no longer fits, returns
            INVALID_NODE_RESTORE (409) or the wiring error, and nothing changes.
          properties:
            formationId:
              type: string
            direction:
              type: string
              enum:
                - input
                - output
            port:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
            index:
              type: integer
              minimum: 0
            connections:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        wireConnection:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            joinIfOccupied:
              type: boolean
              description: Add a formation input and wire to it atomically when the target is fed. Gates and Tools remain single-feed.
            expectedRev:
              type: integer
            updatedBy:
              type: string
        unwireConnection:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        rewireConnection:
          type: object
          properties:
            from:
              type: string
            previousTo:
              type: string
            to:
              type: string
            joinIfOccupied:
              type: boolean
              description: Add a formation input and wire to it atomically when the target is fed. Gates and Tools remain single-feed.
            removePreviousInput:
              type: boolean
              description: Remove the previous formation input atomically after rewiring, only if no other connection uses it. Used to undo a join.
            expectedRev:
              type: integer
            updatedBy:
              type: string
        createEnd:
          type: object
          description: Adds an End node, which ends a path on purpose. Wire routes into its in port with
            wireConnection; any number may lead into one End node, and none leads out of it.
          properties:
            title:
              type: string
              description: Omitted or blank is Done or Rejected, after the outcome.
            outcome:
              type: string
              enum: [done, rejected]
              description: Omitted is done. Any other value returns 400 INVALID_END_OUTCOME.
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateEnd:
          type: object
          description: Changes only the fields given.
          properties:
            id:
              type: string
            title:
              type: string
            outcome:
              type: string
              enum: [done, rejected]
            expectedRev:
              type: integer
            updatedBy:
              type: string
        deleteEnd:
          type: object
          description: Deletes an End node and the routes into it; restoreNode with end undoes it.
          properties:
            id:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        createGate:
          type: object
          properties:
            title:
              type: string
            kinds:
              type: array
              description: Any of code, formation and human. Omitted or empty creates a human gate; check fields
                then return 422 invalid_code_gate_profile until kinds include code.
              items:
                type: string
            criterion:
              type: string
            check:
              type: string
            checkVersion:
              type: string
            checkValue:
              type: string
            files:
              type: array
              description: Absolute reference file paths; blank entries are dropped and a relative path is refused with RELATIVE_FILE_REFERENCE.
              items:
                type: string
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateFormation:
          type: object
          required:
          - id
          description: Sets the formation title when present; an empty string clears it. ID, ports, slots,
            brief, edges, layout and notes are unchanged.
          properties:
            id:
              type: string
            title:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setFormationType:
          type: object
          required:
          - id
          - type
          description: Changes a formation's type in place. solo keeps one slot, peer has at least two
            uncontrolled slots, orchestrated has one controller (the existing one, else the first slot) and a
            worker; added slots are empty. A change to solo with more than one staffed slot returns 409
            SLOT_CHOICE_REQUIRED unless keepSlotId names the slot to keep. slots restores an exact slot list
            (used by undo). Any other type returns 400 UNSUPPORTED_FORMATION_TYPE; a misused keepSlotId or slots
            list returns 400 INVALID_TYPE_CHANGE.
          properties:
            id:
              type: string
            type:
              enum:
              - solo
              - peer
              - orchestrated
            keepSlotId:
              type: string
            slots:
              type: array
              items:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  agentId:
                    type: string
                  harness:
                    type: string
                  model:
                    type: string
                  effort:
                    type: string
                  controller:
                    type: boolean
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateInputCard:
          type: object
          required:
          - id
          description: Sets only the fields present; an empty string clears one. inputHint says what a run
            brief should contain. humanChannel notify or an
            empty string removes the stored channel. ID, edges, layout and notes are unchanged.
          properties:
            id:
              type: string
            title:
              type: string
            goal:
              type: string
            files:
              type: array
              description: Replaces the absolute reference file paths; an empty array clears them, and a relative path is refused with RELATIVE_FILE_REFERENCE.
              items:
                type: string
            inputHint:
              type: string
            humanChannel:
              type: string
              enum:
              - ''
              - notify
              - session
              description: How the mission's human gates reach the operator (ADR-0019). notify, the default,
                is stored as absent; session is stored as humanChannel. Any other value returns
                INVALID_HUMAN_CHANNEL and saves nothing.
            inputs:
              type: array
              description: Replaces the mission's declared inputs; an empty array clears them, leaving the
                implicit required text input brief. A name is a lowercase letter followed by lowercase letters,
                digits or underscores, unique in the mission; a blank kind is text. Anything else returns
                INVALID_MISSION_INPUT and saves nothing. Step briefs reference an input as {name}.
              items:
                type: object
                additionalProperties: false
                required:
                - name
                properties:
                  name:
                    type: string
                    pattern: ^[a-z][a-z0-9_]{0,63}$
                  kind:
                    enum:
                    - text
                    - file
                    - folder
                  required:
                    type: boolean
                  description:
                    type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        updateGate:
          type: object
          required:
          - id
          description: Sets only the fields present. An empty string clears title, criterion or a check field.
            kinds, when present, must be a non-empty set of code, formation and human. Dropping formation detaches
            the judge chain; dropping code clears the check. Unknown kinds return 400 INVALID_GATE_KIND.
          properties:
            id:
              type: string
            title:
              type: string
            kinds:
              type: array
              minItems: 1
              items:
                enum:
                - code
                - formation
                - human
            criterion:
              type: string
            check:
              type: string
            checkVersion:
              type: string
            checkValue:
              type: string
            files:
              type: array
              description: Replaces the absolute reference file paths; an empty array clears them, and a relative path is refused with RELATIVE_FILE_REFERENCE.
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        setGateJudge:
          type: object
          properties:
            gateId:
              type: string
            chain:
              type: array
              items:
                type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        detachGateJudge:
          type: object
          description: Removes the gate's judge chain and its formation kind; a gate left with no kind becomes human.
          properties:
            gateId:
              type: string
            expectedRev:
              type: integer
            updatedBy:
              type: string
        createInputCard:
          type: object
          properties:
            title:
              type: string
            goal:
              type: string
            files:
              type: array
              description: Absolute reference file paths; blank entries are dropped and a relative path is refused with RELATIVE_FILE_REFERENCE.
              items:
                type: string
            humanChannel:
              type: string
              enum:
              - ''
              - notify
              - session
              description: As on updateInputCard; omitted, empty or notify stores no channel.
            x:
              type: integer
            y:
              type: integer
            expectedRev:
              type: integer
            updatedBy:
              type: string
        expectedRev:
          type: integer
        layoutExpectation:
          type: object
        updatedBy:
          type: string
      description: Select one authoring mutation and supply expectedRev plus If-Match. Nested expectedRev/updatedBy
        fields are accepted for several operations. Tool operations require the exact top-level frame
        and layoutExpectation. updateGate, updateFormation,
        setFormationType and updateInputCard share their store paths with archon gate update, formation rename,
        formation set-type and mission update.
    AgentCreate:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          type: string
        summary:
          type: string
        capabilities:
          type: array
          items:
            type: string
        personality:
          type: string
    AgentPatch:
      type: object
      properties:
        addCapability:
          type: string
        removeCapability:
          type: string
        note:
          type: string
        retire:
          type: boolean
          description: true retires the role, false brings it back. A slot that names a retired role stops
            validation and admission with retired_persona.
        displayName:
          type: string
        kind:
          type: string
        summary:
          type: string
        capabilities:
          type: array
          items:
            type: string
      description: Persona editor fields; a role is role text, so there is no harness, model or effort to edit (a
        request naming one, or any field not listed here, is refused with 422 INVALID_AGENT_CARD).
